<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <rect width="1200" height="760" fill="#0d1117"/>

  <text x="40" y="52" fill="#e6edf3" font-size="27" font-weight="600">Two alleles, two different problems — and only one of them is fixable</text>
  <text x="40" y="80" fill="#8b949e" font-size="15">BUB1B compound heterozygosity in the MVA proband. Domain coordinates from UniProt O60566.</text>

  <!-- ============ PANEL A: protein map ============ -->
  <text x="40" y="128" fill="#58a6ff" font-size="13" font-weight="700" letter-spacing="1.5">A · WHERE THE VARIANTS FALL</text>

  <!-- protein bar -->
  <rect x="40" y="150" width="1000" height="34" rx="5" fill="#21262d" stroke="#30363d"/>
  <rect x="99" y="150" width="156" height="34" rx="5" fill="#1f6feb" opacity="0.55"/>
  <text x="177" y="172" fill="#c9d1d9" font-size="12" text-anchor="middle">BUB1 N-terminal 62–226</text>
  <rect x="769" y="150" width="271" height="34" rx="5" fill="#a371f7" opacity="0.55"/>
  <text x="904" y="172" fill="#e6edf3" font-size="12" text-anchor="middle">pseudokinase domain 766–1050</text>
  <text x="44" y="203" fill="#6e7681" font-size="11">1</text>
  <text x="1030" y="203" fill="#6e7681" font-size="11">1050 aa</text>

  <!-- allele 1 marker -->
  <line x1="742" y1="150" x2="742" y2="120" stroke="#f85149" stroke-width="2"/>
  <circle cx="742" cy="150" r="5" fill="#f85149"/>
  <text x="742" y="112" fill="#f85149" font-size="13" font-weight="600" text-anchor="middle">p.Leu737Ter</text>

  <!-- allele 2 marker -->
  <line x1="994" y1="184" x2="994" y2="214" stroke="#d29922" stroke-width="2"/>
  <circle cx="994" cy="184" r="5" fill="#d29922"/>
  <text x="994" y="232" fill="#d29922" font-size="13" font-weight="600" text-anchor="middle">p.Asn1002Lys</text>

  <!-- truncation shading -->
  <rect x="742" y="150" width="298" height="34" rx="5" fill="#f85149" opacity="0.13"/>
  <text x="891" y="143" fill="#f85149" font-size="11" text-anchor="middle" opacity="0.85">deleted by the truncation →</text>

  <!-- ============ PANEL B: consequences ============ -->
  <text x="40" y="288" fill="#58a6ff" font-size="13" font-weight="700" letter-spacing="1.5">B · WHAT EACH ALLELE DOES</text>

  <!-- allele 1 box -->
  <rect x="40" y="306" width="470" height="150" rx="10" fill="#161b22" stroke="#f85149" stroke-width="1.5" opacity="0.95"/>
  <text x="64" y="336" fill="#f85149" font-size="16" font-weight="600">Allele 1 — p.Leu737Ter</text>
  <text x="64" y="364" fill="#c9d1d9" font-size="14">Stop codon before the pseudokinase domain.</text>
  <text x="64" y="388" fill="#c9d1d9" font-size="14">Transcript degraded by nonsense-mediated decay:</text>
  <text x="64" y="412" fill="#c9d1d9" font-size="14">in MVA patient cells, truncating alleles yield</text>
  <text x="64" y="436" fill="#c9d1d9" font-size="14">no detectable protein at all.</text>
  <text x="486" y="436" fill="#6e7681" font-size="11" text-anchor="end">effectively null · not druggable</text>

  <!-- allele 2 box -->
  <rect x="570" y="306" width="470" height="150" rx="10" fill="#161b22" stroke="#d29922" stroke-width="1.5"/>
  <text x="594" y="336" fill="#d29922" font-size="16" font-weight="600">Allele 2 — p.Asn1002Lys</text>
  <text x="594" y="364" fill="#c9d1d9" font-size="14">Normal mRNA. Full-length protein — but the</text>
  <text x="594" y="388" fill="#c9d1d9" font-size="14">pseudokinase fold is what holds BUBR1 stable,</text>
  <text x="594" y="412" fill="#c9d1d9" font-size="14">so the protein misfolds and is cleared early.</text>
  <text x="1016" y="436" fill="#3fb950" font-size="12" text-anchor="end" font-weight="600">a quantity problem — this is the opening</text>

  <!-- ============ PANEL C: cascade ============ -->
  <text x="40" y="508" fill="#58a6ff" font-size="13" font-weight="700" letter-spacing="1.5">C · FROM PROTEIN DOSE TO THE CHILD'S PHENOTYPE</text>

  <g font-size="13" fill="#c9d1d9" text-anchor="middle">
    <rect x="40" y="528" width="176" height="66" rx="8" fill="#21262d" stroke="#30363d"/>
    <text x="128" y="556">too little functional</text><text x="128" y="576">BUBR1 protein</text>

    <rect x="246" y="528" width="176" height="66" rx="8" fill="#21262d" stroke="#30363d"/>
    <text x="334" y="550">weak PP2A-B56</text><text x="334" y="569">recruitment,</text><text x="334" y="588">Aurora B imbalance</text>

    <rect x="452" y="528" width="176" height="66" rx="8" fill="#21262d" stroke="#30363d"/>
    <text x="540" y="556">chromosome</text><text x="540" y="576">missegregation</text>

    <rect x="658" y="528" width="176" height="66" rx="8" fill="#21262d" stroke="#30363d"/>
    <text x="746" y="556">mosaic variegated</text><text x="746" y="576">aneuploidy</text>

    <rect x="864" y="528" width="176" height="66" rx="8" fill="#30363d" stroke="#8b949e"/>
    <text x="952" y="550">senescence +</text><text x="952" y="569">tumour</text><text x="952" y="588">predisposition</text>
  </g>

  <g stroke="#6e7681" stroke-width="1.6" fill="none">
    <path d="M216 561 L242 561" marker-end="url(#ar)"/>
    <path d="M422 561 L448 561" marker-end="url(#ar)"/>
    <path d="M628 561 L654 561" marker-end="url(#ar)"/>
    <path d="M834 561 L860 561" marker-end="url(#ar)"/>
  </g>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#6e7681"/>
    </marker>
  </defs>

  <!-- clinical mapping -->
  <text x="952" y="616" fill="#8b949e" font-size="12" text-anchor="middle">rhabdomyosarcoma · growth failure</text>
  <text x="952" y="634" fill="#8b949e" font-size="12" text-anchor="middle">parental recurrent pregnancy loss</text>

  <!-- intervention points -->
  <g>
    <rect x="40" y="654" width="380" height="72" rx="9" fill="#0f2a17" stroke="#3fb950" stroke-width="1.5"/>
    <text x="62" y="680" fill="#3fb950" font-size="14" font-weight="700">INTERVENTION POINT 1 — raise the dose</text>
    <text x="62" y="702" fill="#c9d1d9" font-size="13">Restoring missense BUBR1 to wild-type levels</text>
    <text x="62" y="719" fill="#c9d1d9" font-size="13">fully restored checkpoint function in patient cells.</text>

    <rect x="452" y="654" width="380" height="72" rx="9" fill="#2a1f0f" stroke="#d29922" stroke-width="1.5"/>
    <text x="474" y="680" fill="#d29922" font-size="14" font-weight="700">INTERVENTION POINT 2 — clear the debris</text>
    <text x="474" y="702" fill="#c9d1d9" font-size="13">Target the senescent-cell burden that aneuploidy</text>
    <text x="474" y="719" fill="#c9d1d9" font-size="13">generates, downstream of the germline defect.</text>
  </g>

  <line x1="128" y1="598" x2="128" y2="650" stroke="#3fb950" stroke-width="1.6" stroke-dasharray="4 3"/>
  <path d="M746 598 L746 634 L642 634 L642 650" stroke="#d29922" stroke-width="1.6" stroke-dasharray="4 3" fill="none"/>

  <text x="864" y="700" fill="#6e7681" font-size="11">Hypotheses for laboratory</text>
  <text x="864" y="716" fill="#6e7681" font-size="11">follow-up — not medical advice.</text>
</svg>
